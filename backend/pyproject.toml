[project]
name = "avtaar-gateway"
version = "0.1.0"
description = "Local gateway for the Avtaar app (Ollama + VoiceStudio)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routes", "app.services"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
